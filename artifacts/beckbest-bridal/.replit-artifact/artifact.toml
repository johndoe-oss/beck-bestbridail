kind = "web"
previewPath = "/"
title = "Beckbest Bridal"
version = "1.0.0"
id = "artifacts/beckbest-bridal"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20688

[services.development]
run = "pnpm --filter @workspace/beckbest-bridal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/beckbest-bridal", "run", "build" ]
serve = "static"
publicDir = "artifacts/beckbest-bridal/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20688"
BASE_PATH = "/"
